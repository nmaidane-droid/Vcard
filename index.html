<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8B0000">
<title>Carte de visite numérique</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Fiche de contact professionnelle accessible par QR code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blanc:#FFFFFF;
  --rouge:#E8001C;
  --bordeaux:#8B0000;
  --encre:#1a1a2e;
  --creme:#F5F3EF;
  --trait:rgba(26,26,46,.14);
  --gris:#6b6b7b;
  --accent:var(--rouge);
  --band:var(--bordeaux);
  --r:14px;
  --pad:clamp(18px,5vw,30px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  overflow-x:clip;
  background:var(--creme);
  color:var(--encre);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-variation-settings:'wdth' 100;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-env:0;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}

/* ---------- structures communes ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad) 64px}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gris)
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- en-tête générateur ---------- */
.ver{
  display:inline-block;margin-left:10px;padding:2px 7px;border-radius:5px;
  background:var(--bordeaux);color:var(--blanc);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em
}

.top{padding:clamp(28px,7vw,54px) 0 22px}
.top h1{
  margin:.35em 0 0;font-size:clamp(30px,7.4vw,52px);line-height:1.02;
  font-weight:800;font-variation-settings:'wdth' 112,'wght' 800;letter-spacing:-.015em
}
.top h1 em{font-style:normal;color:var(--bordeaux)}
.top p{max-width:46ch;color:var(--gris);margin:14px 0 0;font-size:15px}

/* ---------- grille ---------- */
.grid{display:grid;gap:clamp(22px,4vw,40px);grid-template-columns:1fr;min-width:0}
.col-form,.col-preview{min-width:0}
@media(min-width:960px){
  .grid{grid-template-columns:minmax(0,1fr) 420px;align-items:start}
  .col-preview{position:sticky;top:24px}
}

/* ---------- formulaire ---------- */
.panel{background:var(--blanc);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;min-width:0}
.panel + .panel{margin-top:18px}
.panel-h{
  display:flex;align-items:center;gap:10px;padding:15px 18px;
  border-bottom:1px solid var(--trait);background:#fcfbfa
}
.panel-h .n{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--blanc);
  background:var(--band);width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;flex:none
}
.panel-h h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.01em}
.panel-b{padding:18px}
.fields{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.fields.two{grid-template-columns:1fr 1fr}}
label.f{display:block}
label.f > span{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gris);margin-bottom:6px
}
input,textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--trait);border-radius:9px;
  background:var(--blanc);color:var(--encre);font:inherit;font-size:15px;
  transition:border-color .15s,box-shadow .15s
}
textarea{resize:vertical;min-height:74px}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,0,28,.12)
}
.hint{font-size:12.5px;color:var(--gris);margin:7px 0 0}

/* ---------- boutons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:10px;font-size:14.5px;font-weight:600;
  border:1px solid transparent;transition:transform .12s,background .15s,border-color .15s
}
.btn:active{transform:scale(.985)}
.btn-p.ok{background:#5e0000}
.btn-s.ok{border-color:var(--bordeaux);color:var(--bordeaux);background:#fff6f6}
.btn-p{background:var(--band);color:var(--blanc)}
.btn-p:hover{background:#a00}
.btn-s{background:var(--blanc);border-color:var(--trait);color:var(--encre)}
.btn-s:hover{border-color:var(--encre)}
.btn-full{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* ==========================================================
   LA CARTE — coupon de vol
   ========================================================== */
.pass{
  --notch:15px;max-width:min(420px,100%);
  background:var(--blanc);border-radius:18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(26,26,46,.06),0 14px 40px -18px rgba(26,26,46,.3);
  border:1px solid var(--trait);
  max-width:420px;margin:0 auto;position:relative
}
.pass-band{background:var(--band);color:var(--blanc);padding:13px 16px 12px;position:relative}
.pass-band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.pass-band .co{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0
}
.pass-band .co.centre{justify-content:center}
.pass-band .co-name{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;opacity:.95;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap
}
.pass-band .co-logo{
  height:auto;max-height:34px;max-width:210px;width:auto;
  object-fit:contain;display:block;flex:none
}
.pass-band .co-logo.blanc{filter:brightness(0) invert(1)}

.pass-id{padding:16px 16px 2px;display:flex;gap:13px;align-items:flex-start}
.avatar{
  width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;
  background:var(--creme);border:2px solid var(--blanc);
  box-shadow:0 0 0 1px var(--trait);
  display:grid;place-items:center;
  font-weight:800;font-size:18px;font-variation-settings:'wdth' 110,'wght' 800;
  color:var(--bordeaux);letter-spacing:.02em
}
.pass-id h2{
  margin:0;white-space:nowrap;font-size:clamp(21px,5.6vw,26px);line-height:1.1;font-weight:800;
  font-variation-settings:'wdth' 112,'wght' 800;letter-spacing:-.015em;
  text-transform:uppercase;word-break:break-word
}
/* Prénom et nom sur la même ligne, même corps : le contraste vient de la graisse. */
.pass-id h2 .given{
  font-variation-settings:'wdth' 112,'wght' 400;font-weight:400;font-size:.7em;
  color:var(--gris);margin-right:.3em
}
/* Le titre se détache du prénom : trois blocs distincts, pas un prénom composé. */
.pass-id h2 .given.titre{margin-right:.48em}
.pass-role{
  margin:7px 0 0;font-size:14px;color:var(--encre);font-weight:500;
  white-space:nowrap;overflow:hidden
}
/* Seconde fonction : même corps, même couleur, même graisse. Seul l'écart
   vertical est resserré pour que les deux lignes se lisent comme un bloc. */
.pass-role.role2{margin-top:3px}
.pass-tagline{
  margin:12px 16px 0;padding:10px 12px;background:var(--creme);border-radius:9px;
  font-size:13px;line-height:1.4;color:#4a4a5c;border-left:3px solid var(--accent)
}

.rows{margin:10px 0 0;padding:0 8px}
.row{
  display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:10px;
  text-decoration:none;transition:background .15s
}
.row:hover{background:var(--creme)}
.row .ic{
  width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--creme);color:var(--bordeaux)
}
.row .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .v{
  min-width:0;flex:1;font-size:15px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
/* Une adresse complète ne tient pas sur une ligne : on lui en accorde deux. */
.row.multi .v{
  white-space:normal;line-height:1.28;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical
}
.row .go{color:#c3c3cf;flex:none}
.row .go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.perf{position:relative;height:18px;margin-top:6px}
body.fiche .perf{height:14px;margin-top:4px}
.perf::before,.perf::after{
  content:"";position:absolute;top:50%;transform:translateY(-50%);
  width:var(--notch);height:var(--notch);border-radius:50%;
  background:var(--creme);border:1px solid var(--trait)
}
.perf::before{left:calc(var(--notch) / -2 - 1px);border-left-color:transparent;border-bottom-color:transparent}
.perf::after{right:calc(var(--notch) / -2 - 1px);border-right-color:transparent;border-top-color:transparent}
.perf i{
  position:absolute;top:50%;left:16px;right:16px;height:0;
  border-top:2px dashed rgba(26,26,46,.2);display:block
}

.sortir{
  position:fixed;left:14px;top:14px;z-index:46;
  width:36px;height:36px;border-radius:50%;
  display:none;align-items:center;justify-content:center;
  background:var(--rouge);color:var(--blanc);
  box-shadow:0 2px 8px -2px rgba(232,0,28,.55)
}
body.fiche .sortir.on{display:inline-flex}
.sortir.inverse{background:var(--blanc);color:var(--rouge);box-shadow:0 2px 8px -2px rgba(0,0,0,.4)}
/* Croix posée sur le bandeau : on décale son contenu pour ne rien masquer. */
body.fiche .pass.croix-band .pass-band{padding-left:58px}
body.fiche .pass.croix-band .co.centre{justify-content:flex-start}
.sortir svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

.stub{padding:2px 16px 18px;text-align:center}
.stub .qr{
  width:140px;height:140px;margin:4px auto 10px;display:block;
  border-radius:10px;background:var(--blanc)
}
.stub .aide{
  margin:9px 2px 0;font-size:11.5px;line-height:1.4;color:var(--gris);text-align:center
}
.stub .cap{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
.stub .btn{margin-top:10px}

/* Fiches très fournies : un cran de compression supplémentaire. */
.pass.dense .pass-id{padding:13px 16px 0}
.pass.dense .avatar{width:46px;height:46px;font-size:16px}
.pass.dense .pass-id h2{font-size:clamp(19px,5vw,23px)}
.pass.dense .pass-role{margin-top:5px;font-size:13.5px}
.pass.dense .pass-tagline{margin-top:9px;padding:8px 11px;font-size:12.5px}
.pass.dense .rows{margin-top:6px}
.pass.dense .row{padding:6px 8px}
.pass.dense .row .ic{width:27px;height:27px}
.pass.dense .row .v{font-size:14.5px}
.pass.dense .stub .qr{width:118px;height:118px}

/* ---------- vue fiche publique ---------- */
body.fiche{background:var(--creme);display:block}
.fiche-wrap{
  min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 8px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:center;gap:8px
}
/* Plein écran : la carte occupe toute la place, le talon reste calé en bas. */
body.fiche .pass{max-width:100%;width:100%}
body.fiche .pass-id{padding:16px 16px 2px}
body.fiche .pass-id h2{font-size:clamp(23px,6.6vw,30px)}
body.fiche .pass-role{font-size:15px}
body.fiche .avatar{width:72px;height:72px;font-size:24px}
body.fiche .rows{padding:0 10px}
body.fiche .row{padding:8px 9px}
body.fiche .row .ic{width:34px;height:34px}
body.fiche .row .ic svg{width:18px;height:18px}
body.fiche .row .v{font-size:16px}
body.fiche .pass-tagline{font-size:13.5px;padding:10px 12px;margin:11px 16px 0}
body.fiche .stub{padding:2px 16px 14px}
body.fiche .stub .btn{padding:13px 18px;font-size:15px;margin-top:8px}
@media(min-width:600px){
  body.fiche .pass{max-width:420px;margin:0 auto}
  .fiche-wrap{justify-content:center;padding-top:24px}
}

/* ---------- QR panneau ---------- */
.qr-box{text-align:center;padding:6px 0 2px}
.qr-box canvas{width:100%;max-width:min(260px,100%);height:auto;image-rendering:pixelated;border-radius:10px;background:#fff}
.qr-meta{
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:14px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gris)
}
.qr-meta b{display:block;color:var(--encre);font-size:13px;font-weight:600;margin-top:2px}
.warn{
  margin-top:14px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.4;
  background:#fff4f4;border:1px solid rgba(232,0,28,.25);color:#8B0000;text-align:left
}
.link-box{
  display:flex;gap:8px;align-items:center;margin-top:14px;padding:10px 12px;min-width:0;max-width:100%;
  background:var(--creme);border-radius:9px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gris);
  overflow:hidden
}
.link-box span{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}

/* ---------- fiches enregistrées ---------- */
.saved{display:grid;gap:8px}
.saved-item{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;
  border:1px solid var(--trait);border-left:3px solid transparent;border-radius:10px;
  background:var(--blanc);transition:background .15s,border-left-color .15s
}
.saved-item.on{border-left-color:var(--accent);background:#fffaf9}
button.nm{
  flex:1 1 150px;min-width:0;text-align:left;display:block;padding:2px 0;border-radius:6px
}
button.nm:hover b{text-decoration:underline}
.saved-item .flag{
  display:none;margin-left:8px;vertical-align:middle;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bordeaux);
  border:1px solid rgba(139,0,0,.3);border-radius:5px;padding:2px 6px
}
.saved-item.on .flag{display:inline-block}
.saved-acts{display:flex;gap:7px;flex:none}
.saved-item .nm b{font-size:14px;font-weight:600}
.saved-item .nm .line{display:flex;align-items:center;min-width:0}
.saved-item .nm .line b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-item .nm small{display:block;color:var(--gris);font-size:12px;margin-top:1px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--trait);background:var(--blanc);color:var(--encre);
  font-size:12.5px;font-weight:600
}
.icon-btn:hover{background:var(--creme)}
.icon-btn.danger{color:var(--bordeaux);border-color:rgba(139,0,0,.28)}
.icon-btn.danger:hover{background:#fff4f4}
.icon-btn.bare{min-height:36px;padding:8px;border-color:transparent}
.icon-btn.bare:hover{border-color:var(--trait)}
.icon-btn svg{width:16px;height:16px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--gris);font-size:13.5px;padding:14px 0}




/* ---------- préparation de la photo ---------- */
.photo-tool{margin-top:14px;border:1px solid var(--trait);border-radius:11px;overflow:hidden}
.photo-tool .head{
  padding:11px 13px;background:#fcfbfa;border-bottom:1px solid var(--trait);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gris)
}
.photo-tool .body{padding:14px;display:grid;gap:12px;justify-items:center}
.crop{
  width:220px;height:220px;border-radius:50%;overflow:hidden;position:relative;
  background:var(--creme);box-shadow:0 0 0 1px var(--trait),0 0 0 8px var(--blanc),0 0 0 9px var(--trait);
  touch-action:none;cursor:grab
}
.crop canvas{display:block;width:100%;height:100%}
.crop.vide{display:grid;place-items:center;
  font-size:12.5px;color:var(--gris);text-align:center;padding:24px;cursor:default}
.zoom{width:220px;display:flex;align-items:center;gap:10px}
.zoom input{flex:1;padding:0;height:26px;accent-color:var(--bordeaux)}
.zoom span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gris);letter-spacing:.1em}
.photo-tool .actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}

.switch{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px;border:1px solid var(--trait);border-radius:10px;background:var(--blanc);
  cursor:pointer;margin-top:14px
}
.switch .lbl{font-size:14.5px;font-weight:500}
.switch .lbl small{display:block;color:var(--gris);font-size:12.5px;font-weight:400;margin-top:2px}
.switch .track{
  width:46px;height:27px;border-radius:99px;background:#d8d4cf;flex:none;position:relative;
  transition:background .18s
}
.switch .track::after{
  content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:var(--blanc);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s
}
.switch[aria-checked="true"] .track{background:var(--bordeaux)}
.switch[aria-checked="true"] .track::after{transform:translateX(19px)}

/* ---------- vue QR plein écran ---------- */
body.qrview{background:var(--blanc)}
.qr-full{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px;text-align:center
}
.qr-mode{
  margin-top:14px;padding:11px 20px;border-radius:999px;
  background:var(--bordeaux);color:var(--blanc);
  font-size:13.5px;font-weight:600;
  box-shadow:0 3px 12px -4px rgba(139,0,0,.6);
  max-width:calc(100vw - 32px)
}
.qr-mode:active{transform:scale(.985)}
.qr-envoi{
  margin-top:10px;padding:10px 18px;border-radius:999px;
  border:1px solid var(--trait);background:var(--blanc);color:var(--encre);
  font-size:13px;font-weight:600;max-width:calc(100vw - 32px)
}
.qr-envoi:active{transform:scale(.985)}
.qr-envoi.ok{border-color:var(--bordeaux);color:var(--bordeaux);background:#fff6f6}

.qr-mot{
  margin-bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gris);
  max-width:calc(100vw - 32px)
}

.qr-plate{padding:0;line-height:0;border-radius:10px;background:var(--blanc)}
.qr-plate canvas{display:block;image-rendering:pixelated;border-radius:4px}


/* ---------- pastille d'installation ---------- */
.install{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;
  display:none;align-items:center;gap:8px;
  padding:10px 16px;border-radius:999px;
  background:var(--bordeaux);color:var(--blanc);
  font-size:13px;font-weight:600;
  box-shadow:0 6px 20px -8px rgba(139,0,0,.7);
  max-width:calc(100vw - 32px)
}
.install.on{display:inline-flex}
.install svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--encre);color:var(--blanc);padding:11px 18px;border-radius:10px;
  font-size:13.5px;font-weight:500;z-index:50;transition:opacity .2s,transform .2s;
  max-width:calc(100vw - 32px);text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.jump{
  position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  display:none;align-items:center;gap:7px;padding:11px 16px;border-radius:999px;
  background:var(--bordeaux);color:var(--blanc);font-size:13.5px;font-weight:600;
  box-shadow:0 6px 20px -6px rgba(139,0,0,.6)
}

function qrToCanvas(qr,canvas,scale,quiet){

    aux capteurs anciens. Choix technique, pas esthétique. */
 ctx.fillStyle='#000000';

  if(qr.modules[y][x])ctx.fillRect((x+quiet)*scale,(y+quiet)*scale,scale,scale);

var VERSION_APP='1.3';   /* +0,1 à chaque livraison ; 1.9 -> 2.0. À reporter dans sw.js */
/* Correction à 15 %, identique partout. Mesuré : passer à 25 % ferait grossir

var LOGO_DEFAUT='logo-blanc.png';

            'logo','logow','titre','fonction2'];

/* ============================================================

   ============================================================ */
/* Le nom tient sur une seule ligne quelle que soit sa longueur :
   on mesure le texte rendu et on réduit le corps dans la même proportion. */
function ajusterUneLigne(sel,plancher){
 $$(sel).forEach(function(h){
  h.style.fontSize='';
  var dispo=h.parentNode.clientWidth;
  if(!dispo||!h.scrollWidth)return;
  if(h.scrollWidth<=dispo)return;
  var base=parseFloat(getComputedStyle(h).fontSize);
  var cible=Math.max(plancher,base*dispo/h.scrollWidth);
  h.style.fontSize=cible.toFixed(1)+'px';
  if(h.scrollWidth>dispo)
   h.style.fontSize=Math.max(plancher,cible*dispo/h.scrollWidth).toFixed(1)+'px';});}
function ajusterNoms(){

 ajusterUneLigne('.pass-role',10.5);}
window.addEventListener('resize',ajusterNoms);

function esc(v){return String(v||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}

 if(f.fixe)L.push('TEL;TYPE=WORK,VOICE:'+f.fixe.replace(/[^\d+]/g,''));

function safeImg(u){u=String(u||'').trim();

 /* fichier du dépôt : à côté de index.html ou dans un sous-dossier, ex. photos/nom.jpg */
 if(/^[\w][\w .\-]*(\/[\w][\w .\-]*)?\.(png|jpe?g|svg|webp)$/i.test(u))return u;
 return'';}
function normUrl(u){u=String(u||'').trim();
 if(!u)return'';
 return/^https?:\/\//i.test(u)?u:'https://'+u;}
function telHref(t){return'tel:'+String(t).replace(/[^\d+]/g,'');}
function waHref(t){return'https://wa.me/'+String(t).replace(/\D/g,'');}

var $=function(s,r){return(r||document).querySelector(s);};

function el(tag,attrs,html){var e=document.createElement(tag);
 if(attrs)Object.keys(attrs).forEach(function(k){
  if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);});
 if(html!==undefined)e.innerHTML=html;return e;}
/* Tout contenu venant de la fiche passe par elT : jamais innerHTML,
   sinon un lien de fiche piégé pourrait injecter du code dans la page. */
function elT(tag,attrs,text){var e=el(tag,attrs);
 if(text!==undefined)e.textContent=String(text==null?'':text);return e;}

 setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);}

function renderPass(f,opts){
 opts=opts||{};
 var skin=f.skin==='1';
 var wrap=el('article',{class:'pass'});
 if(skin)wrap.style.setProperty('--band','#1a1a2e');
 var fullName=((f.prenom||'')+' '+(f.nom||'')).trim()||'Votre nom';

 /* bandeau */
 var band=el('div',{class:'pass-band'});
 var co=el('div',{class:'co'});
 /* Champ vide : on utilise le logo livré avec l'application, ce qui fait
    apparaître le logo même sur les liens créés avant son ajout. */
 var logo=f.logow==='n'?'':(safeImg(f.logo)||LOGO_DEFAUT);
 if(logo)co.className='co centre';
 if(logo){
  var im=el('img',{class:'co-logo blanc',src:logo,alt:f.societe||''});
  im.onerror=function(){ /* logo introuvable : on retombe sur le nom de la société */
   var t=elT('div',{class:'co-name'},f.societe||'Fiche de contact');
   co.className='co';
   if(im.parentNode)im.parentNode.replaceChild(t,im);};
  co.appendChild(im);}
 else co.appendChild(elT('div',{class:'co-name'},f.societe||'Fiche de contact'));
 band.appendChild(co);
 wrap.appendChild(band);

 /* identité */
 var id=el('div',{class:'pass-id'});
 var av,photo=safeImg(f.photo);
 if(photo){av=el('img',{class:'avatar',src:photo,alt:'',loading:'lazy'});
  av.onerror=function(){var d=elT('div',{class:'avatar'},initials(f));
   if(av.parentNode)av.parentNode.replaceChild(d,av);};}
 else av=elT('div',{class:'avatar'},initials(f));
 id.appendChild(av);
 var txt=el('div',{class:'pass-name',style:'min-width:0;flex:1'});
 var h=el('h2');
 if(f.titre)h.appendChild(elT('span',{class:'given titre'},f.titre));
 if(f.prenom)h.appendChild(elT('span',{class:'given'},f.prenom));
 h.appendChild(document.createTextNode(f.nom||(f.prenom?'':'Votre nom')));
 txt.appendChild(h);
 if(f.fonction)txt.appendChild(elT('p',{class:'pass-role'},f.fonction));
 if(f.fonction2)txt.appendChild(elT('p',{class:'pass-role role2'},f.fonction2));
 id.appendChild(txt);
 wrap.appendChild(id);

 if(f.baseline)wrap.appendChild(elT('p',{class:'pass-tagline'},f.baseline));

 /* coordonnées */
 var rows=el('div',{class:'rows'});
 /* L'icône porte le sens : le libellé reste en aria-label pour les lecteurs d'écran. */
 function addRow(icon,k,v,href,multi){
  if(!v)return;
  var a=el(href?'a':'div',{class:'row'+(multi?' multi':''),'aria-label':k+' : '+v});
  if(href){a.href=href;if(/^https?:/.test(href)){a.target='_blank';a.rel='noopener';}}
  a.innerHTML='<span class="ic">'+svgIcon(icon)+'</span><span class="v"></span>'+
   (href?'<span class="go">'+svgIcon('go')+'</span>':'');
  $('.v',a).textContent=v;
  rows.appendChild(a);}
 addRow('mobile','Mobile',f.mobile,telHref(f.mobile));
 addRow('phone','Téléphone',f.fixe,telHref(f.fixe));
 addRow('wa','WhatsApp',f.whatsapp,waHref(f.whatsapp));
 addRow('mail','E-mail',f.email,'mailto:'+f.email);
 addRow('web','Site',f.site&&f.site.replace(/^https?:\/\//i,''),normUrl(f.site));
 addRow('in','LinkedIn',f.linkedin&&f.linkedin.replace(/^https?:\/\/(www\.)?/i,''),normUrl(f.linkedin));
 addRow('ig','Instagram',f.instagram&&f.instagram.replace(/^https?:\/\/(www\.)?/i,''),normUrl(f.instagram));
 var adr=[f.adresse,f.ville,f.pays].filter(Boolean).join(', ');
 addRow('pin','Adresse',adr,adr?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(adr):null,true);
 if(rows.children.length)wrap.appendChild(rows);
 /* Mode compact réservé à l'aperçu du générateur : sur la fiche, toutes
    les cartes doivent se ressembler, quel que soit le nombre de contacts. */
 if(!opts.withSave&&(rows.children.length>5||(rows.children.length>4&&f.baseline)))
  wrap.classList.add('dense');

 /* talon */
 var perf=el('div',{class:'perf'});perf.appendChild(el('i'));
 wrap.appendChild(perf);
 var stub=el('div',{class:'stub'});
 if(opts.qrText){
  var cv=el('canvas',{class:'qr','aria-label':'QR code de la fiche'});
  var q=QRCodec.encode(opts.qrText,niveauQR(opts.qrText));
  if(q)qrToCanvas(q,cv,6,3);
  stub.appendChild(cv);
  stub.appendChild(el('div',{class:'cap'},opts.qrCaption||'Scannez pour ouvrir la fiche'));
 }
 if(opts.withSave){
  var nomFichier=(fullName.replace(/[^\w\u00C0-\u017F -]/g,'').trim()||'contact').replace(/\s+/g,'-')+'.vcf';
  function vcfBlob(){return new Blob([buildVCard(f)],{type:'text/vcard;charset=utf-8'});}

  /* Chemin le plus court : le panneau de partage reçoit le fichier et propose
     Contacts parmi les destinations — un appui, la fiche s'ouvre dans le carnet
     d'adresses, sans passer par les téléchargements. Le téléchargement reste
     en secours là où le partage de fichier n'existe pas (Chrome bloque par
     ailleurs l'ouverture directe d'un blob, essayé et écarté en v33). */
  function partageFichierPossible(){
   if(!navigator.canShare||!window.File)return false;
   try{return navigator.canShare({files:[new File(['x'],'t.vcf',{type:'text/vcard'})]});}
   catch(e){return false;}}

  var partageOk=partageFichierPossible();
  var b=el('button',{class:'btn btn-p btn-full',type:'button'},'Ajouter à mes contacts');
  b.addEventListener('click',function(){
   if(!partageOk){
    download(vcfBlob(),nomFichier);
    retourBouton(b,'Fichier t\u00e9l\u00e9charg\u00e9 \u2713',2400);
    return;}
   var fichier=new File([buildVCard(f)],nomFichier,{type:'text/vcard'});
   navigator.share({files:[fichier],title:fullName||'Contact'})
    .then(function(){retourBouton(b,'Contact envoy\u00e9 \u2713');},
          function(err){
      /* refus ou partage indisponible : on retombe sur le téléchargement */
      if(err&&err.name==='AbortError')return;
      download(vcfBlob(),nomFichier);
      retourBouton(b,'Fichier t\u00e9l\u00e9charg\u00e9 \u2713',2400);});});
  stub.appendChild(b);

  stub.appendChild(elT('p',{class:'aide'},partageOk
   ? 'Choisissez Contacts dans la liste qui s\u2019ouvre.'
   : 'Ouvrez ensuite le fichier depuis vos t\u00e9l\u00e9chargements pour l\u2019enregistrer.'));}
 if(stub.children.length)wrap.appendChild(stub);
 return wrap;}

/* La croix se cale en haut de la bande blanche au-dessus de la carte.
   Fiche très fournie : cette bande peut tomber à 27 px, la croix passe
   alors sur le bandeau du logo, en inverse pour rester lisible. */
function placerSortir(){
 var x=$('#sortir'),carte=$('body.fiche .pass');
 if(!x||x.hidden||!carte)return;
 var haut=carte.getBoundingClientRect().top,taille=x.offsetHeight||36;
 /* Calée en haut de la bande blanche plutôt que centrée : centrée,
    elle frôlait le bandeau du logo. */
 if(haut-taille>=14){
  x.classList.remove('inverse');carte.classList.remove('croix-band');
  x.style.top=Math.max(6,Math.min(14,haut-taille-6))+'px';return;}
 var bandeau=$('.pass-band',carte);
 var hb=bandeau?bandeau.offsetHeight:52;
 x.classList.add('inverse');carte.classList.add('croix-band');
 x.style.top=Math.round(haut+(hb-taille)/2)+'px';}
window.addEventListener('resize',placerSortir);

var promptInstall=null,vueInstall='app';

 return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}

function majInstall(){
 var b=$('#install');if(!b)return;
 b.className='install';b.hidden=true;b.onclick=null;b.textContent='';

 if(redessinerQR)setTimeout(redessinerQR,0);}

/* Retour visible : sur téléphone, un simple toast passe inaperçu. */
function retourBouton(btn,texte,ms){
 if(btn.getAttribute('data-occupe'))return;
 var avant=btn.textContent;
 btn.setAttribute('data-occupe','1');
 btn.textContent=texte;
 btn.classList.add('ok');
 if(navigator.vibrate){try{navigator.vibrate(18);}catch(e){}}
 setTimeout(function(){btn.textContent=avant;btn.classList.remove('ok');
  btn.removeAttribute('data-occupe');},ms||2000);}

/* L'écran ne doit pas s'éteindre pendant que l'autre personne cherche son appareil photo. */
var veille=null;
function garderEcranAllume(actif){
 if(!actif){if(veille){try{veille.release();}catch(e){}veille=null;}return;}
 if(!navigator.wakeLock||veille)return;
 navigator.wakeLock.request('screen').then(function(w){veille=w;
  w.addEventListener('release',function(){veille=null;});},function(){});}
document.addEventListener('visibilitychange',function(){
 if(document.visibilityState==='visible'&&document.body.classList.contains('qrview'))
  garderEcranAllume(true);});

   ============================================================ */
var redessinerQR=null;
window.addEventListener('resize',function(){if(redessinerQR)redessinerQR();});

function lienDe(code){return location.origin+location.pathname+'#c='+code;}

/* Le raccourci ouvre une adresse fixe (?v=qr) : Chrome crée toujours le raccourci
   vers l'adresse de départ du manifeste, jamais vers la page affichée.
   La fiche à montrer est donc mémorisée sur l'appareil. */
var CLE_QR='carte.qr';
function memoriserQR(code){try{localStorage.setItem(CLE_QR,code);}catch(e){}}
/* Première ouverture d'un lien reçu : le raccourci s'attache à cette fiche
   et n'en change plus. Sans ce garde-fou, préparer la fiche d'un collaborateur
   écrasait la sienne — le raccourci affichait alors la mauvaise carte. */
function memoriserSiVierge(code){if(!qrMemorise())memoriserQR(code);}

/* Le code contient toute la fiche : la moindre correction le change, et le
   raccourci resterait sur l'ancienne version. On le suit donc automatiquement,
   mais seulement s'il s'agit de la même personne — travailler sur la fiche
   d'un collaborateur ne doit jamais déplacer le raccourci. */
function suivreSiMemePersonne(f){
 var actuel=qrMemorise();
 if(!actuel)return false;
 var ancienne=unpacker(actuel);
 if(!ancienne)return false;
 if(cleFiche(ancienne)!==cleFiche(f))return false;
 var code=packer(f);
 if(code===actuel)return false;
 memoriserQR(code);
 return true;}
function qrMemorise(){try{return localStorage.getItem(CLE_QR)||'';}catch(e){return'';}}
function urlPleinEcran(code){return location.pathname+'?v=qr#qr='+code;}
/* Aperçu depuis le générateur : on n'écrit rien en mémoire. */
function urlApercu(code){return location.pathname+'?v=qr&apercu#qr='+code;}
function estApercu(){return /[?&]apercu(&|$)/.test(location.search);}

/* Raccourci ouvert avant qu'une fiche ait été choisie. */

function viewQR(code,f){
 document.body.className='qrview';
 var xs=$('#sortir');if(xs){xs.hidden=true;xs.classList.remove('on');}
 var jp=$('#jump');if(jp)jp.hidden=true;
 vueInstall='qr';majInstall();
 document.title='QR code';
 var app=$('#app');app.innerHTML='';

 var w=el('div',{class:'qr-full'});
 /* La légende passe au-dessus du code : sous la bascule, on la lisait
    comme une description du bouton et non du code affiché. */
 var mot=elT('div',{class:'qr-mot'},'');
 w.appendChild(mot);
 var plaque=el('button',{class:'qr-plate',type:'button','aria-label':'Ouvrir ma fiche'});
 var cv=el('canvas');
 plaque.appendChild(cv);
 plaque.addEventListener('click',function(){location.href=location.pathname+'#c='+code;});
 w.appendChild(plaque);

 /* Deux codes, un seul affiché à la fois : côte à côte ils feraient
    la moitié de la largeur et deviendraient difficiles à scanner. */
 var bascule=el('button',{class:'qr-mode',type:'button'});
 w.appendChild(bascule);

 /* Envoi à distance : la vCard part comme fichier de contact, sans lien.
    Le panneau du système s'ouvre, on choisit WhatsApp puis le destinataire. */
 var envoi=el('button',{class:'qr-envoi',type:'button'},'Envoyer ma vCard');
 w.appendChild(envoi);
 envoi.addEventListener('click',function(){
  var nomF=(((f.prenom||'')+' '+(f.nom||'')).trim().replace(/[^\w\u00C0-\u017F -]/g,'')
            ||'contact').replace(/\s+/g,'-')+'.vcf';
  var texte=buildVCard(f);
  var fichier=null;
  try{fichier=new File([texte],nomF,{type:'text/vcard'});}catch(e){}
  if(fichier&&navigator.canShare&&navigator.canShare({files:[fichier]})){
   navigator.share({files:[fichier],title:((f.prenom||'')+' '+(f.nom||'')).trim()})
    .then(function(){retourBouton(envoi,'vCard envoy\u00e9e \u2713');},
          function(err){if(!err||err.name!=='AbortError')replier();});
   return;}
  replier();
  function replier(){
   download(new Blob([texte],{type:'text/vcard;charset=utf-8'}),nomF);
   retourBouton(envoi,'Fichier t\u00e9l\u00e9charg\u00e9 \u2713',2400);
   toast('Partagez le fichier depuis vos t\u00e9l\u00e9chargements');}});
 app.appendChild(w);

 if(!estApercu()){
  if(!qrMemorise())memoriserQR(code);
  else{var f0=unpacker(code);if(f0)suivreSiMemePersonne(f0);}}

 var lien=lienDe(code);
 /* La vCard du QR se passe de la photo, de l'horodatage et de la note :
    inutiles pour joindre quelqu'un, et ils coûtent douze modules. */
 var vcf=buildVCard(f).split('\r\n')
   .filter(function(l){return !/^(PHOTO|REV|NOTE)/.test(l);}).join('\r\n');
 var codes={
  fiche:{qr:QRCodec.encode(lien,niveauQR(lien)),
         mot:'Ouvre la fiche compl\u00e8te',
         autre:'Passer au code vCard'},
  contact:{qr:QRCodec.encode(vcf,niveauQR(vcf)),
         mot:'Enregistre le contact directement',
         autre:'Passer au code fiche'}};
 /* La vCard d'abord : le geste le plus fréquent est d'enregistrer le contact.
    La fiche reste à un appui pour qui veut voir la carte. */
 var mode='contact';

 function appliquer(){
  var c=codes[mode];
  if(!c.qr){toast('QR illisible');return;}
  bascule.textContent=c.autre;
  mot.textContent=c.mot;
  plaque.setAttribute('aria-label',mode==='fiche'?'Ouvrir ma fiche':'Code vCard');
  redessinerQR();}

 bascule.addEventListener('click',function(){
  mode=(mode==='fiche')?'contact':'fiche';appliquer();});

 /* Le côté du QR est un multiple entier du module : sinon les pixels bavent au scan. */
 redessinerQR=function(){
  var qr=codes[mode].qr;
  if(!qr)return;
  var n=qr.size+8;
  var bi=$('#install');
  var reserve=(bi&&!bi.hidden)?bi.offsetHeight+26:0;
  var dispo=Math.min(window.innerWidth-16,window.innerHeight-92-reserve);
  /* On cale un nombre entier de pixels PHYSIQUES par module, pas de pixels CSS :
     le code reste parfaitement net et gagne près de 10 % de largeur. */
  var dpr=Math.min(3,window.devicePixelRatio||1);
  var ech=Math.max(2,Math.floor(dispo*dpr/n));
  var cote=n*ech/dpr;
  qrToCanvas(qr,cv,ech,4);
  cv.style.width=cote+'px';cv.style.height=cote+'px';};

function copyText(txt,msg){

  var ta=el('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(msg);}catch(e){toast('Copie impossible');}
  document.body.removeChild(ta);}}

/* ============================================================
   PRÉPARATION DE LA PHOTO
   La photo ne peut pas voyager dans le QR : un portrait pèse 15 000 octets
   quand il en reste 2 400 dans le code. On produit donc un fichier à déposer
   dans le dépôt, et seul son nom voyage dans l'adresse.

var COTE_PHOTO=256;

function outilPhoto(conteneur){
 var bloc=el('section',{class:'photo-tool'});
 bloc.appendChild(el('div',{class:'head'},'Pr\u00e9parer la photo'));
 var body=el('div',{class:'body'});

 var cadre=el('div',{class:'crop vide'});
 cadre.textContent='Aucune photo choisie';
 var cv=el('canvas',{width:String(COTE_PHOTO),height:String(COTE_PHOTO)});
 var ctx=cv.getContext('2d');

 var zoomBox=el('div',{class:'zoom'});
 zoomBox.style.display='none';
 var lz=el('span',{},'Zoom');
 var rng=el('input',{type:'range',min:'100',max:'300',value:'100','aria-label':'Zoom de la photo'});
 zoomBox.appendChild(lz);zoomBox.appendChild(rng);

 var actions=el('div',{class:'actions'});
 var bChoisir=el('button',{class:'btn btn-s',type:'button'},'Choisir une photo');
 var bValider=el('button',{class:'btn btn-p',type:'button'},'Enregistrer la photo');
 bValider.style.display='none';
 actions.appendChild(bChoisir);actions.appendChild(bValider);

 var input=el('input',{type:'file',accept:'image/*'});
 input.style.display='none';

 body.appendChild(cadre);body.appendChild(zoomBox);body.appendChild(actions);
 body.appendChild(el('p',{class:'hint'},
  'Cadrez le visage, enregistrez, puis d\u00e9posez le fichier obtenu dans le dossier photos/ du d\u00e9p\u00f4t. Le champ Photo se remplit tout seul.'));
 body.appendChild(input);
 bloc.appendChild(body);
 conteneur.appendChild(bloc);

 var img=null,zoom=1,dx=0,dy=0,base=1;

 function dessiner(){
  if(!img)return;
  ctx.clearRect(0,0,COTE_PHOTO,COTE_PHOTO);
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,COTE_PHOTO,COTE_PHOTO);
  var e=base*zoom,w=img.width*e,h=img.height*e;
  ctx.drawImage(img,(COTE_PHOTO-w)/2+dx,(COTE_PHOTO-h)/2+dy,w,h);}

 function borner(){
  var e=base*zoom,w=img.width*e,h=img.height*e;
  var mx=Math.max(0,(w-COTE_PHOTO)/2),my=Math.max(0,(h-COTE_PHOTO)/2);
  dx=Math.max(-mx,Math.min(mx,dx));dy=Math.max(-my,Math.min(my,dy));}

 bChoisir.addEventListener('click',function(){input.click();});
 input.addEventListener('change',function(){
  var f=input.files&&input.files[0];
  if(!f)return;
  var lecteur=new FileReader();
  lecteur.onload=function(){
   var im=new Image();
   im.onload=function(){
    img=im;
    /* le plus petit c\u00f4t\u00e9 remplit le cercle : jamais de vide sur les bords */
    base=COTE_PHOTO/Math.min(im.width,im.height);
    zoom=1;dx=0;dy=0;rng.value='100';
    cadre.textContent='';cadre.classList.remove('vide');
    cadre.appendChild(cv);
    zoomBox.style.display='flex';bValider.style.display='inline-flex';
    dessiner();};
   im.onerror=function(){toast('Image illisible');};
   im.src=lecteur.result;};
  lecteur.readAsDataURL(f);});

 rng.addEventListener('input',function(){
  zoom=parseInt(rng.value,10)/100;borner();dessiner();});

 var glisse=false,px=0,py=0;
 function debut(e){if(!img)return;glisse=true;var p=pos(e);px=p.x;py=p.y;
  cadre.style.cursor='grabbing';}
 function bouge(e){
  if(!glisse||!img)return;
  e.preventDefault();
  var p=pos(e),f=COTE_PHOTO/cadre.clientWidth;
  dx+=(p.x-px)*f;dy+=(p.y-py)*f;px=p.x;py=p.y;
  borner();dessiner();}
 function fin(){glisse=false;cadre.style.cursor='grab';}
 function pos(e){var t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
 cadre.addEventListener('mousedown',debut);
 cadre.addEventListener('touchstart',debut,{passive:true});
 window.addEventListener('mousemove',bouge);
 cadre.addEventListener('touchmove',bouge,{passive:false});
 window.addEventListener('mouseup',fin);
 cadre.addEventListener('touchend',fin);

 bValider.addEventListener('click',function(){
  if(!img)return;
  var nom=fileBase(state.f)+'.jpg';
  cv.toBlob(function(bl){
   if(!bl){toast('Enregistrement impossible');return;}
   download(bl,nom);
   state.f.photo='photos/'+nom;

   toast('Photo enregistr\u00e9e \u2014 d\u00e9posez-la dans photos/');
  },'image/jpeg',0.82);});
}

function fileBase(f){
 var s=(f.prenom||'')+'-'+(f.nom||'');
 if(s.normalize)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 s=s.replace(/[^A-Za-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');
 return(s||'carte').toLowerCase();}


/* ============================================================
   9. ROUTAGE
   ============================================================ */
function route(){
 var h=location.hash||'';
 garderEcranAllume(false);
 redessinerQR=null;
 var mq=h.match(/^#qr=([A-Za-z2-7]+)$/i);
 var pleinEcran=/[?&]v=qr(&|$)/.test(location.search);
 var code=mq?mq[1]:(pleinEcran?qrMemorise():'');
 if(code){
  var fq=unpacker(code);
  if(fq){viewQR(code,fq);return;}
  toast('Lien illisible');}
 if(pleinEcran){viewQRVide();return;}
 var m=h.match(/^#c=([A-Za-z2-7]+)$/i);
 if(m){
  var f=unpacker(m[1]);
  if(f){viewFiche(f);return;}
  toast('Lien de fiche illisible');}
 viewGenerateur();}
window.addEventListener('hashchange',route);
route();

  navigator.serviceWorker.register('sw.js').catch(function(){});});}
